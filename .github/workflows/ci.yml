name: ci

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
# Hosted runners OOM / lose heartbeat when cargo builds and runs the full
# suite at default parallelism (debuginfo + many engine integration tests).
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude hyperform-gui --all-targets -- -D warnings
      # Cap build and test threads so the runner stays under memory pressure.
      - run: cargo test --workspace --exclude hyperform-gui -j 2 -- --test-threads=2
      - name: Generated protocol TypeScript is committed
        run: git diff --exit-code -- crates/hyperform-gui/ui/src/lib/protocol

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation links resolve
        run: python3 scripts/check_docs_links.py
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci --prefix website
      - run: npm test --prefix website
      - name: Documentation website builds (dead links fail it)
        run: npm run build --prefix website

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: x64
          - target: aarch64-pc-windows-msvc
            name: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Windows-only code paths compile (${{ matrix.name }})
        run: >-
          cargo check --target ${{ matrix.target }} --all-targets
          -p hyperform-protocol -p hyperform-llm -p hyperform-config -p hyperform-policy
          -p hyperform-host -p hyperform-integrations -p hyperform-context -p hyperform-verify
          -p hyperform-store -p hyperform-tools -p hyperform-engine

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci --prefix crates/hyperform-gui/ui
      - run: npm test --prefix crates/hyperform-gui/ui
