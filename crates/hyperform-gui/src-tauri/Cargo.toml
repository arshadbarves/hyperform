[package]
name = "hyperform-gui"
description = "Desktop shell (Tauri 2) over the HyperForm AI engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hyperform-gui"
path = "src/main.rs"

[features]
# The decision model's native runtime (Laya through ONNX Runtime); off by default.
onnx = ["hyperform-engine/onnx"]

[dependencies]
hyperform-engine.workspace = true
hyperform-protocol.workspace = true
hyperform-config.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
anyhow = "1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tempfile.workspace = true
window-vibrancy = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
