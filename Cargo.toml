[workspace]
exclude = ["tmp"]
resolver = "3"
members = [
    # engine (see AGENTS.md)
    "crates/hyperform-protocol",
    "crates/hyperform-prompts",
    "crates/hyperform-llm",
    "crates/hyperform-config",
    "crates/hyperform-policy",
    "crates/hyperform-host",
    "crates/hyperform-integrations",
    "crates/hyperform-context",
    "crates/hyperform-verify",
    "crates/hyperform-store",
    "crates/hyperform-decisions",
    "crates/hyperform-work",
    "crates/hyperform-tools",
    "crates/hyperform-engine",
    "crates/hyperform-testkit",
    # desktop application
    "crates/hyperform-gui/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Arshad Barves"]

[workspace.dependencies]
# internal (v2)
hyperform-protocol = { path = "crates/hyperform-protocol" }
hyperform-prompts = { path = "crates/hyperform-prompts" }
hyperform-llm = { path = "crates/hyperform-llm" }
hyperform-config = { path = "crates/hyperform-config" }
hyperform-policy = { path = "crates/hyperform-policy" }
hyperform-host = { path = "crates/hyperform-host" }
hyperform-integrations = { path = "crates/hyperform-integrations" }
hyperform-context = { path = "crates/hyperform-context" }
hyperform-verify = { path = "crates/hyperform-verify" }
hyperform-store = { path = "crates/hyperform-store" }
hyperform-decisions = { path = "crates/hyperform-decisions" }
hyperform-work = { path = "crates/hyperform-work" }
hyperform-tools = { path = "crates/hyperform-tools" }
hyperform-engine = { path = "crates/hyperform-engine" }
hyperform-testkit = { path = "crates/hyperform-testkit" }

# external
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
toml = "0.9"
dirs = "6"
futures = "0.3"
globset = "0.4"
regex = "1"
ignore = "0.4"
similar = "2"
strsim = "0.11"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
htmd = "0.5"
pdf-extract = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
which = "7"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
# the decision model's native runtime (optional `onnx` feature); rc.10 keeps MSRV 1.85
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# dev-dependencies shared across crates
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
